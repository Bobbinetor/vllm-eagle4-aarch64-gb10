name: Run report
description: Report a successful or failed run on a DGX Spark / GB10
title: "[run] <DGX Spark model> — <result>"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. A report is most useful when it includes the exact
        versions and the two checks below. Negative results are welcome: they
        are how the next person avoids the same trap.
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Machine, GPU, memory
      placeholder: "DGX Spark, GB10, 121 GB unified memory"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and driver
      description: Output of `uname -a` and `nvidia-smi --query-gpu=driver_version --format=csv,noheader`
      placeholder: "Ubuntu 24.04.5, driver 580.159.03"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: vLLM, torch, eagle-harness
      description: Output of `python3 -c "import vllm, torch; print(vllm.__version__, torch.__version__)"` and `pip show eagle-harness`
      placeholder: "0.32.0rc1.dev283+eagle.3 2.14.0+cu130 eagle-harness 0.1.4"
    validations:
      required: true
  - type: textarea
    id: hooks
    attributes:
      label: Hook checks
      description: Output of `eagle-harness-check` and `python3 scripts/audit_hooks.py vllm-*.whl`
      render: text
      placeholder: |
        10/10 hooks present
        RESULT: PASS
    validations:
      required: true
  - type: textarea
    id: bench
    attributes:
      label: Benchmark
      description: Output of `python3 scripts/bench.py --preset agentic --requests 3`
      render: text
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: What worked, what did not
      description: Errors, workarounds, OOM, unexpected numbers, anything the next person should know
      render: text
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I verified the wheel checksum before running it.
          required: true
        - label: I understand this is an unofficial community build.
          required: true
